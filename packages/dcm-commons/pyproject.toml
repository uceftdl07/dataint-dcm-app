[project]
name = "dcm-commons"
version = "0.1.0"
description = "Shared library for Data Connect Monitoring — models, auth, base collector, Apigee client"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — TotalEnergies internal use only" }
authors = [{ name = "Yahia ZERDOUMI", email = "yahia.zerdoumi@totalenergies.com" }]
keywords = ["monitoring", "azure", "aws", "data", "metrics"]

dependencies = [
    "pydantic>=2.7",
    "msal>=1.31",
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",       # Retry / backoff for HTTP calls
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",          # Mock httpx calls in tests
    "freezegun>=1.5",       # Freeze time in token expiry tests
    "ruff>=0.4",
    "mypy>=1.10",
]

# ---------------------------------------------------------------------------
# Build backend
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcm_commons"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["dcm_commons", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade (enforce modern Python syntax)
    "B",    # flake8-bugbear (common bugs)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking (TYPE_CHECKING imports)
    "RUF",  # Ruff-specific rules
    "ANN",  # flake8-annotations (type hints)
    "D",    # pydocstyle (docstring conventions)
    "PTH",  # flake8-use-pathlib
    "ASYNC",# flake8-async
]
ignore = [
    "D100", # Missing docstring in public module   (covered by index.md)
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in __init__
    "ANN101", # Missing type for `self`
    "ANN102", # Missing type for `cls`
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["dcm_commons"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy — static type checker
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["msal.*", "structlog.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "unit: pure unit tests with no I/O",
    "integration: tests that require external services",
]

[tool.uv]
link-mode = "copy"
constraint-dependencies = [
    "urllib3>=2.7.0",
    "cryptography>=50.0.0",
]
