[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcm-backend"
version = "0.1.0"
description = "DCM Core Backend API — FastAPI service on ECS Fargate"
requires-python = ">=3.12"
dependencies = [
    "dcm-commons",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "databricks-sql-connector>=3.0.0",
    "databricks-sdk>=0.20.0",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "structlog>=24.0",
    "boto3>=1.34",
    "pydantic-settings>=2.14.2",
    "pyarrow",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
dcm-backend = "app.main:start"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PERF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.uv]
link-mode = "copy"
constraint-dependencies = [
    "urllib3>=2.7.0",
    "pyasn1>=0.6.4",
    "cryptography>=50.0.0",
]

[tool.uv.sources]
dcm-commons = { path = "../dcm-commons", editable = true }
