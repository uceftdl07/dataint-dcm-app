[tool.uv]
link-mode = "copy"

[tool.uv.sources]
dcm-commons = { path = "../dcm-commons", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcm-lambda-ingestion"
version = "0.1.0"
description = "DCM Lambda ingestion API — validates and routes MetricPayload to SQS"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "dcm-commons",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[sqs]>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "boto3-stubs[sqs]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "BLE", "C4", "SIM", "RUF"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["lambda_ingestion"]
