name: 'Validate DAB bundle'
description: 'It validates DAB bundles for the specified Databricks environment'

inputs:
  DATABRICKS_ENVIRONMENT:
    description: 'databricks environment'
    required: true


runs:
  using: "composite"
  steps:   
    - uses: actions/checkout@v4    
    - uses: databricks/setup-cli@main
    - name: validate bundle
      shell: bash
      run: |
        databricks bundle validate -t "$DATABRICKS_BUNDLE_ENV"
      working-directory: packages/dcm-databricks-pipeline
      env:
        DATABRICKS_BUNDLE_ENV: ${{ inputs.DATABRICKS_ENVIRONMENT }}
